[project]
name = "gvi_ws"
version = "0.1.0"
description = "Implementation of a Gaussian Variational Inference algorithm for state-estimation in Robotics."
authors = [
    { name="Andrew Stirling", email="andrew.stirling2@mail.mcgill.ca" }
]

dependencies = [
    # Core math / science stack
    "numpy==2.2.6",
    "scipy==1.15.3",
    "pandas==2.2.3",
    "scikit-learn==1.7.0",
    "scikit-sparse==0.4.16",
    "matplotlib==3.10.3",
    "seaborn==0.13.2",

    # Project-specific external deps
    "navlie @ git+https://github.com/decargroup/navlie@effb2fefc45cb06ff97ff4f787bda8e240686578",
    "pymlg @ git+https://github.com/decargroup/pymlg@e0bfac968180713aaf06a19a0ddb634a83945258",
    "bagpy==0.5",
    "rosbags==0.10.10",
    "rospkg==1.6.0",
    "py3rosmsgs==1.18.2",
    "evo==1.31.1",
    "csaps==1.3.2",
    "ruamel.yaml==0.18.10",
    "PyYAML==6.0.2",
    "tqdm==4.67.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"